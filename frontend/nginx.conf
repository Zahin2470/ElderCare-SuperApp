server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API is same-origin: the browser only ever talks to this host, so refresh cookies stay first-party (no CORS).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }

  # Hashed build assets can be cached forever; index.html must always be revalidated.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / {
    try_files $uri /index.html;   # client-side routes like /silverbox survive a refresh
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
  }
}
